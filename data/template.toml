#  The Kazakh suffix template.
#
#  Kazakh suffixation is a fixed sequence of slots, not a set of rules with
#  conditions. Every slot names a grammatical category, says where in the chain
#  it sits, and lists the shapes it takes. A word form is a stem plus an
#  ordered walk through this table; anything that is not such a walk is not a
#  word.
#
#  This file is the specification, read by the assignment tools and by the
#  engine, so the two cannot drift. Four things it can express that a Hunspell
#  affix file cannot:
#
#  `order`    a slot may only be followed by one of strictly higher order, so
#             `мектеп-тер-іміз-де` is a word and `*мектеп-де-тер` is not. No
#             per-rule condition can see the difference; both suffixes are
#             legal on the stem, and only their sequence is wrong.
#
#  `group`    slots sharing a group are mutually exclusive — a verb takes a
#             participle or a converb or a finite tense, never two.
#
#  `requires` a slot may demand a feature of the entry. Only a transitive verb
#             has a passive: `жаз` gives `жазылды`, `отыр` does not give
#             `*отырылды`. This is the distinction apertium-kaz carries as
#             V-TV against V-IV and hunspell-kk has no way to record.
#
#  `restart`  a slot may derive a new stem, on either track, after which the
#             chain begins again. `бар` + `ған` is a participle that then
#             inflects as a noun — `барғаным` — and `трансформация` + `ла` is a
#             verb that then inflects as one. This is why a single flat list of
#             suffixes cannot describe the language.
#
#  Allomorph lists are what grammar gives, not what a corpus happened to yield.
#  Choosing between the shapes in a slot is phonology — harmony and voicing —
#  and belongs to the engine, not here.

[meta]
version = 1

# ─── Nominal derivation. Makes a new stem, so the chain restarts. ────────────

[[slot]]
id = "sozjasam"
name = "сөзжасам"
gloss = "derivation, noun to noun or adjective"
track = "n"
order = 10
restart = "n"
morphemes = [
  "лық", "лік", "дық", "дік", "тық", "тік",
  "шы", "ші", "шыл", "шіл",
  "сыз", "сіз", "лы", "лі", "ды", "ді", "ты", "ті",
  "ша", "ше",
  "ғы", "гі", "қы", "кі",
  "лас", "лес", "дас", "дес", "тас", "тес",
  "ыңқы", "іңкі", "шық", "шік",
]

[[slot]]
id = "etis_jasam"
name = "етістік тудырушы жұрнақ"
gloss = "denominal verb formation"
track = "n"
order = 10
restart = "v"
morphemes = [
  "ла", "ле", "да", "де", "та", "те",
  "лан", "лен", "дан", "ден", "тан", "тен",
  "лас", "лес", "дас", "дес", "тас", "тес",
  "лат", "лет", "дат", "дет", "тат", "тет",
  "ландыр", "лендір",
]

# ─── Nominal inflection: көптік, тәуелдік, септік, жіктік, in that order. ────

[[slot]]
id = "koptik"
name = "көптік жалғау"
gloss = "plural"
track = "n"
order = 20
morphemes = ["лар", "лер", "дар", "дер", "тар", "тер"]
a_after = ["vowel", "glide", "r"]   # балалар, таулар, үйлер, қарлар

[[slot]]
id = "tauelik"
name = "тәуелдік жалғау"
gloss = "possessive"
track = "n"
order = 30
morphemes = [
  "м", "ым", "ім", "ң", "ың", "ің", "ы", "і", "сы", "сі",
  "мыз", "міз", "ымыз", "іміз", "ңыз", "ңіз", "ыңыз", "іңіз",
  "ларың", "лерің", "дарың", "дерің", "тарың", "терің",
  "ңдар", "ңдер", "ыңдар", "іңдер",
  "ыңыздар", "іңіздер", "ңыздар", "ңіздер",   # балаңыздар, after a vowel
]

# Each case is its own slot, sharing an order and a group so exactly one of
# them can appear. Lumping them into a single септік slot hid the fact that
# their alternations are different — `-лар/-дар/-тар` spreads over three
# groups, `-да/-та` over two — and the phonology, which reads the series off
# the slot, could not tell them apart. `қалада` was refused for it.
#
# The `-н` variants attach only after a possessive: `қаласы-нан`, never
# `*қала-нан`. `after` is what says so; without it both `қаладан` and
# `*қаланан` are licensed, because a possessive leaves a vowel-final stem and
# the plain allomorph fits one too.

[[slot]]
id = "ilik"
name = "ілік септік"
gloss = "genitive"
track = "n"
order = 40
group = "septik"
morphemes = ["ның", "нің", "дың", "дің", "тың", "тің"]
# A nasal takes `-ның` here and `-ды` in the accusative, on the same
# alternation. Only the slot can say which, so it does.
a_after = ["vowel", "nasal"]        # қаланың, жанның — but таудың, елдің

[[slot]]
id = "barys"
name = "барыс септік"
gloss = "dative"
track = "n"
order = 40
group = "septik"
morphemes = ["ға", "ге", "қа", "ке"]

[[slot]]
id = "barys_px"
name = "барыс септік (тәуелдіктен кейін)"
gloss = "dative after a possessive"
track = "n"
order = 40
group = "septik"
after = ["tauelik", "tauelik_of"]
morphemes = ["на", "не", "а", "е"]

[[slot]]
id = "tabys"
name = "табыс септік"
gloss = "accusative"
track = "n"
order = 40
group = "septik"
morphemes = ["ны", "ні", "ды", "ді", "ты", "ті"]
a_after = ["vowel"]                 # қаланы, but жанды, тауды, елді

[[slot]]
id = "tabys_px"
name = "табыс септік (тәуелдіктен кейін)"
gloss = "accusative after a possessive"
track = "n"
order = 40
group = "septik"
after = ["tauelik", "tauelik_of"]
morphemes = ["н"]
a_after = ["vowel"]   # қаласын, үйін — the possessive leaves a vowel

[[slot]]
id = "jatys"
name = "жатыс септік"
gloss = "locative"
track = "n"
order = 40
group = "septik"
morphemes = ["да", "де", "та", "те"]

[[slot]]
id = "jatys_px"
name = "жатыс септік (тәуелдіктен кейін)"
gloss = "locative after a possessive"
track = "n"
order = 40
group = "septik"
after = ["tauelik", "tauelik_of"]
morphemes = ["нда", "нде"]
a_after = ["vowel"]   # қаласында — likewise

[[slot]]
id = "shygys"
name = "шығыс септік"
gloss = "ablative"
track = "n"
order = 40
group = "septik"
# `-нан/-нен` is the ablative after a nasal — `құмнан`, `әлемнен`, `жаннан`,
# `күннен` — and it was missing, so every noun ending in one lost its ablative.
# It is not the `-нан` of `shygys_px`, which follows a possessive and a vowel.
morphemes = ["дан", "ден", "тан", "тен", "нан", "нен"]
a_after = ["nasal"]                 # жаннан, but қаладан, таудан, елден

[[slot]]
id = "shygys_px"
name = "шығыс септік (тәуелдіктен кейін)"
gloss = "ablative after a possessive"
track = "n"
order = 40
group = "septik"
after = ["tauelik", "tauelik_of"]
morphemes = ["нан", "нен"]
a_after = ["vowel"]   # қаласынан — likewise

[[slot]]
id = "komektes"
name = "көмектес септік"
gloss = "instrumental — invariant, it does not harmonise"
track = "n"
order = 40
group = "septik"
morphemes = ["мен", "бен", "пен", "менен", "бенен", "пенен"]
a_after = ["vowel", "glide", "r", "liquid", "nasal"]   # таумен, елмен, жанмен

# Two nominal suffixes that attach *after* inflection, not before it. Filing
# them with the other derivation put them at order 10, where nothing that
# follows септік or тәуелдік can reach them — and `үйдегі`, `ондағы`, `бүгінгі`
# and `әкемдікі` are ordinary words. apertium-kaz spells the combinations out
# as single entries (`дағы`, `дегі`, `дікі`); here they compose, which is the
# whole point of having an order.

[[slot]]
id = "attr"
name = "қатыстық сын есім жұрнағы"
gloss = "attributive: the one at, in or of — үйдегі, ондағы, бүгінгі"
track = "n"
order = 44
restart = "n"
morphemes = ["ғы", "гі", "қы", "кі"]

# `-дай/-дей` was filed with the other derivation at order 10, where nothing
# following тәуелдік could reach it — the same mistake `-ғы` was in, and the
# same everyday words lost to it: `баласындай` is in 404 of 3,860 books,
# `шамасындай` 62, `қолындай` 53, `анаңдай` 41. It attaches to a bare stem too,
# which is why it is not gated on тәуелдік the way the `-н` cases are.

[[slot]]
id = "salystyru"
name = "салыстырмалы жұрнақ"
gloss = "like, resembling — баладай, қолындай"
track = "n"
order = 44
restart = "n"
# д against т only, with no A-member to decide anything: voiced finals take
# `-дай` and voiceless `-тай`. `баладай`, `ердей`, `аттай`.
morphemes = ["дай", "дей", "тай", "тей"]

[[slot]]
id = "salystyru_px"
name = "салыстырмалы жұрнақ (тәуелдіктен кейін)"
gloss = "the same after a third-person possessive: баласындай"
track = "n"
order = 44
restart = "n"
after = ["tauelik"]
morphemes = ["ндай", "ндей"]
a_after = ["vowel"]

# `-ша/-ше` is the other suffix that was filed at order 10 and needed to be
# above the inflection: `өзінше` is in 1,255 books, `менімше` 142,
# `айтқанынша` 31, and every one of them is a possessive with `-ше` on top.

# Салыстырмалы шырай, which was missing altogether. `көбірек` is in 1,279 of
# the 3,860 editions, `азырақ` 861, `тереңірек` 484, `жақынырақ` 469,
# `жақсырақ` 345, `ұзағырақ` 274, `кішірек` 262. `-лау/-леу` is the same
# degree by another suffix: `үлкендеу` 187, `кішілеу` 157.
#
# It sits above the inflection like the other шырай suffixes, and derives a
# new nominal — `көбірегі`, `жақсырағын`.

[[slot]]
id = "shyrai"
name = "салыстырмалы шырай"
gloss = "the comparative: көбірек, жақсырақ, үлкендеу"
track = "n"
order = 44
restart = "n"
morphemes = [
  "рақ", "рек", "ырақ", "ірек",
  "лау", "леу", "дау", "деу", "тау", "теу",
]

[[slot]]
id = "salystyru_sha"
name = "-ша/-ше жұрнағы"
gloss = "in the manner of — өзінше, менімше"
track = "n"
order = 44
restart = "n"
morphemes = ["ша", "ше"]

[[slot]]
id = "tauelik_of"
name = "тәуелдік жалғаудың -нікі түрі"
gloss = "possessive-of, making a nominal: менікі, әкемдікі"
track = "n"
order = 45
restart = "n"
morphemes = ["нікі", "дікі", "тікі"]
a_after = ["vowel"]                 # менікі, оныкі — but әкемдікі

[[slot]]
id = "jiktik_n"
name = "жіктік жалғау"
gloss = "predicative person on a nominal"
track = "n"
order = 50
morphemes = [
  "мын", "мін", "бын", "бін", "пын", "пін",
  "сың", "сің", "сыз", "сіз",
  "мыз", "міз", "быз", "біз", "пыз", "піз",
  "сыңдар", "сіңдер", "сыздар", "сіздер",
]
# The first person singular and plural alternate on the same м/б/п and do not
# divide the finals the same way. After a nasal the singular is `-мын` —
# `барғанмын` 108 books, `барғанбын` none — and the plural is `-быз`:
# `барғанбыз` 84, `адамбыз` 223, `жанбыз` 94, against no `-мыз` at all. After a
# liquid both are the м series: `елміз` 225.
a_after_for = [
  { member = "мыз", after = ["vowel", "glide", "r", "liquid"] },
  { member = "міз", after = ["vowel", "glide", "r", "liquid"] },
]


# ─── Verbal voice. The passive is the reason `requires` exists. ──────────────

[[slot]]
id = "etis_pass"
name = "ырықсыз етіс"
gloss = "passive"
track = "v"
order = 10
requires = ["v-trans"]
morphemes = ["ыл", "іл", "л", "ын", "ін", "н"]

[[slot]]
id = "etis_refl"
name = "өздік етіс"
gloss = "reflexive"
track = "v"
order = 11
morphemes = ["ын", "ін", "н"]

[[slot]]
id = "etis_recip"
name = "ортақ етіс"
gloss = "reciprocal or joint"
track = "v"
order = 12
morphemes = ["ыс", "іс", "с"]

[[slot]]
id = "etis_caus"
name = "өзгелік етіс"
gloss = "causative"
track = "v"
order = 13
morphemes = ["дыр", "дір", "тыр", "тір", "ғыз", "гіз", "қыз", "кіз", "т", "ыт", "іт"]

# ─── Negation, then exactly one of the finite/non-finite forms. ──────────────

[[slot]]
id = "bolymsyz"
name = "болымсыздық жұрнағы"
gloss = "negation"
track = "v"
order = 20
morphemes = ["ма", "ме", "ба", "бе", "па", "пе"]
# A nasal takes -ба, not -ма: `сенбейді` 483 books and `сенмейді` none,
# `көнбейді` 504 and `көнмейді` none, and so for every verb ending in one.
# The plural divides the finals the same way; the instrumental, on the same
# м/б/п, does not — `жанмен`, not `*жанбен`.
a_after = ["vowel", "glide", "r", "liquid"]

[[slot]]
id = "kosemshe"
name = "көсемше"
gloss = "converb"
track = "v"
order = 30
group = "finiteness"
morphemes = [
  "ып", "іп", "п", "а", "е", "й",
  "ғалы", "гелі", "қалы", "келі",
  "ғанша", "генше", "қанша", "кенше",   # `барғанша` — until doing
]

[[slot]]
id = "esimshe"
name = "есімше"
gloss = "participle — inflects as a nominal afterwards"
track = "v"
order = 30
group = "finiteness"
restart = "n"
morphemes = [
  "ған", "ген", "қан", "кен",
  "атын", "етін", "йтын", "йтін",
  # The same participle spelt long, and not rare: `айтатұғын` is in 210 of
  # 3,860 books against 1,515 for `айтатын`, `болатұғын` 175 against 2,467.
  "атұғын", "етұғын",
  "ар", "ер", "р", "мақ", "мек", "бақ", "бек", "пақ", "пек",
  "мақшы", "мекші", "бақшы", "бекші", "пақшы", "пекші",   # `бармақшы` — intent
  # The negative aorist is fused: `алмас`, `болмас`, `айтпас`. It is not
  # болымсыздық followed by anything the template can reach separately.
  "мас", "мес", "бас", "бес", "пас", "пес",
  "ушы", "уші", "ғыш", "гіш", "қыш", "кіш",
]

[[slot]]
id = "tuiyq"
name = "тұйық етістік"
gloss = "verbal noun — inflects as a nominal afterwards"
track = "v"
order = 30
group = "finiteness"
restart = "n"
morphemes = ["у"]

# The tenses and the moods are one slot each in most descriptions, and cannot
# be here, because the personal endings that follow them are not the same set.
# `бардым` and `барсам` take -м; `барадым` and `барсыным` are not words. Only
# two of these six categories take that series, so only they can be named in
# the `after` of the slot that carries it — which means they have to be slots.

[[slot]]
id = "shaq_jedel"
name = "жедел өткен шақ"
gloss = "simple past — takes the -м/-ң/-қ personal series"
track = "v"
order = 30
group = "finiteness"
morphemes = ["ды", "ді", "ты", "ті"]

[[slot]]
id = "shaq_osy"
name = "ауыспалы осы шақ"
gloss = "present, third person — the person is already in it"
track = "v"
order = 30
group = "finiteness"
morphemes = ["ады", "еді", "йды", "йді", "айды", "ейді"]

[[slot]]
id = "rai_shart"
name = "шартты рай"
gloss = "conditional — takes the -м/-ң/-қ personal series, as the past does"
track = "v"
order = 30
group = "finiteness"
morphemes = ["са", "се"]

[[slot]]
id = "rai"
name = "рай"
gloss = "mood: қалау, бұйрық"
track = "v"
order = 30
group = "finiteness"
# `-ғы/-гі` is the қалау рай of `барғым келеді`, spelt exactly like the nominal
# `-ғы` of `жазғы`; `-ыңыз/-ыңдар` are second-person imperatives spelt exactly
# like the possessives they are not. Both were read as errors when they were
# missing from this list, and both took real forms out of the language with them.
morphemes = [
  "йын", "йін", "айын", "ейін", "ғай", "гей", "қай", "кей",
  # бұйрық рай, third person and first plural: `барсын`, `барайық`. Both were
  # absent, and both are everyday forms — apertium-kaz has carried them all along.
  "сын", "сін", "айық", "ейік",
  # After a vowel-final stem the `-айық` loses its own: `ойнайық` 101 books,
  # `байқайық` 88. `-алық/-елік` is the same person again — `көтерелік` 45,
  # `қоштасалық` 24 — and apertium-kaz spells it out as well.
  "йық", "йік", "алық", "елік",
  "ыңыз", "іңіз", "ыңдар", "іңдер", "ңыз", "ңіз", "ңдар", "ңдер",
  # The formal plural imperative, which тәуелдік has and рай did not, so it
  # was reachable only on a stem that is also a noun: `келіңіздер` is in 165
  # of the 3,860 editions, `айтыңыздар` 96, `отырыңыздар` 80.
  "ыңыздар", "іңіздер", "ңыздар", "ңіздер",
  "шы", "ші", "ңызшы", "ңізші",
]

# Two personal series, not one. apertium-kaz keeps them apart as V-PERS-S1 and
# V-PERS-S2, and the second — `бардым`, `барсам`, `бардық`, `барсақ` — was
# missing entirely, so the past and the conditional had no person at all
# outside the third: `бардық` is in 497 books, `келдік` in 1,147, `келсек` in
# 855, and none of them could be built.

# The қалау рай derives a nominal and then takes a possessive, which is the
# whole construction: `барғысы келеді`, `көргім келді`. It cannot sit with the
# other moods, because they do not — `барсынсы` is nothing. `көргісі` is in 530
# of 3,860 books, `айтқысы` 526, `барғысы` 322, `барғым` 205.

[[slot]]
id = "rai_qalau"
name = "қалау рай"
gloss = "the -ғы of барғысы келеді — derives a nominal, so a possessive follows"
track = "v"
order = 30
group = "finiteness"
restart = "n"
morphemes = ["ғы", "гі", "қы", "кі"]

[[slot]]
id = "jiktik_otken"
name = "жіктік жалғау (жедел өткен шақ пен шартты рай)"
gloss = "personal endings on the past and the conditional"
track = "v"
order = 50
after = ["shaq_jedel", "rai_shart"]
morphemes = [
  "м", "ң", "қ", "к",
  "ңыз", "ңіз", "ңдар", "ңдер",
  "ңыздар", "ңіздер",
  # Third plural, optional and much rarer than the rest: `бардылар` 20 books,
  # `барсалар` 6. The plural of a verb, not the көптік of a noun.
  "лар", "лер",
]

# The aorist has a first person singular of its own, beside the -мын it shares
# with everything else: `барам` in 994 of 3,860 books against `барамын` in
# 1,256, `білем` in 1,354. apertium-kaz carries it as V-PERS-AOR. It follows
# the көсемше vowel and nothing else, which `a_after` says — without it
# `*айтыпм` is as licensed as `барам`.

[[slot]]
id = "jiktik_aor"
name = "жіктік жалғау (ауыспалы осы шақ)"
gloss = "first person singular on the aorist: барам, келем"
track = "v"
order = 50
after = ["kosemshe"]
a_after = ["vowel"]
morphemes = ["м"]

[[slot]]
id = "jiktik_v"
name = "жіктік жалғау"
gloss = "predicative person on a verb"
track = "v"
order = 50
morphemes = [
  "мын", "мін", "бын", "бін", "пын", "пін",
  "сың", "сің", "сыз", "сіз",
  "мыз", "міз", "быз", "біз", "пыз", "піз",
  "сыңдар", "сіңдер", "сыздар", "сіздер",
  # Third person after the көсемше, which is how Kazakh writes hearsay:
  # `кетіпті` in 1,637 of 3,860 books, `алыпты` 1,344, `келіпті` 1,215.
  # apertium calls it ifi_evid and it was reachable here only when the
  # converb happened to be a lexicon entry of its own.
  "ды", "ді", "ты", "ті",
]
# The first person singular and plural alternate on the same м/б/п and do not
# divide the finals the same way. After a nasal the singular is `-мын` —
# `барғанмын` 108 books, `барғанбын` none — and the plural is `-быз`:
# `барғанбыз` 84, `адамбыз` 223, `жанбыз` 94, against no `-мыз` at all. After a
# liquid both are the м series: `елміз` 225.
a_after_for = [
  { member = "мыз", after = ["vowel", "glide", "r", "liquid"] },
  { member = "міз", after = ["vowel", "glide", "r", "liquid"] },
]


# `-шы/-ші` softens an order into a request, and it comes after the person
# rather than before it: `барсаңшы` is бар-са-ң-шы, not бар-шы-са-ң. That is
# why it needs an order of its own above жіктік — the рай slot already carries
# a `-шы` for `айтшы`, where there is no person in between.
#
# After a vowel it takes a `й`: `болсайшы`, in 220 of 3,860 books.

[[slot]]
id = "otinish"
name = "өтініш демеулігі"
gloss = "the -шы of a softened request: барсаңшы, болсайшы"
track = "v"
order = 60
after = ["rai", "rai_shart", "jiktik_otken"]
morphemes = ["шы", "ші", "йшы", "йші"]
